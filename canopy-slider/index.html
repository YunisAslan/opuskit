<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Canopy — an immersive slider</title>
  <meta name="theme-color" content="#1d3a1a" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;800&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="preloader" aria-live="polite">
    <div class="preloader__inner">
      <p class="preloader__label">Growing the forest</p>
      <p class="preloader__count"><span>0</span>%</p>
      <div class="preloader__bar"><i></i></div>
    </div>
  </div>

  <main class="stage" aria-roledescription="carousel"></main>

  <div class="vignette" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <svg class="wipe" aria-hidden="true"><line /></svg>

  <button class="menu-btn" type="button" aria-expanded="false" aria-controls="menu" data-hover>
    <span class="menu-btn__ring"></span><span class="menu-btn__label">Menu</span>
  </button>

  <nav class="rail" aria-label="Slides"></nav>

  <div class="scroll-hint" aria-hidden="true"><span class="scroll-hint__line"></span>Scroll</div>

  <a class="brand" href="#/dawn" aria-label="Canopy home" data-hover>
    <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 4c7 6 10 12 10 18a10 10 0 0 1-20 0C10 16 13 10 20 4Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M20 12v24M20 22l-5-4M20 27l6-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    <span>Canopy</span>
  </a>

  <p class="counter" aria-live="polite"><span class="counter__current">01</span><i></i><span class="counter__total">06</span></p>

  <div class="menu" id="menu" aria-hidden="true">
    <ol class="menu__list"></ol>
  </div>

  <aside class="card" aria-hidden="true" role="dialog" aria-labelledby="card-title">
    <button class="card__close" type="button" data-hover aria-label="Close">Close</button>
    <p class="card__eyebrow"></p>
    <h3 class="card__title" id="card-title"></h3>
    <p class="card__text"></p>
  </aside>

  <div class="cursor" aria-hidden="true"><span class="cursor__ring"></span><span class="cursor__dot"></span></div>

  <script type="module" src="app.js"></script>
</body>
</html>
